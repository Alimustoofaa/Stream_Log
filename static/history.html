<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafana-Style Log History</title>
    <script src="/static/js/tailwindcss.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        grafana: {
                            bg: 'var(--color-bg)',
                            panel: 'var(--color-panel)',
                            border: 'var(--color-border)',
                            text: 'var(--color-text)',
                            strong: 'var(--color-strong)',
                            muted: 'var(--color-muted)',
                            info: '#3274d9',
                            warn: '#e0b400',
                            error: '#e02f44',
                            hover: 'var(--color-hover)'
                        }
                    },
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-bg: #f4f5f5;
            --color-panel: #ffffff;
            --color-border: #e4e7eb;
            --color-text: #202226;
            --color-strong: #000000;
            --color-muted: #6e7479;
            --color-hover: #f8f9fa;
        }

        html.dark {
            --color-bg: #111217;
            --color-panel: #181b1f;
            --color-border: #22252b;
            --color-text: #ccccdc;
            --color-strong: #ffffff;
            --color-muted: #8e8e93;
            --color-hover: #1f2228;
        }

        body { background-color: var(--color-bg); color: var(--color-text); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: var(--color-bg); }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 5px; border: 2px solid var(--color-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-muted); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Top Navigation Bar -->
    <header class="border-b border-grafana-border bg-grafana-bg h-14 flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4">
            <a href="/" class="text-grafana-muted hover:text-grafana-strong transition-colors" title="Home">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </a>
            <h1 class="text-sm font-semibold tracking-wide text-grafana-strong">Log History</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-5xl mx-auto px-6 py-8">
        <div class="bg-grafana-panel border border-grafana-border rounded flex flex-col">
            <div class="px-4 py-3 border-b border-grafana-border bg-grafana-bg/50 rounded-t flex items-center justify-between">
                <h2 class="text-xs font-semibold text-grafana-strong uppercase tracking-wider">Available Dates</h2>
            </div>
            
            {% if dates %}
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-px bg-grafana-border">
                {% for date in dates %}
                <a href="/{{ date }}" class="flex items-center justify-between px-4 py-4 bg-grafana-panel hover:bg-grafana-hover transition-colors group">
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-grafana-muted group-hover:text-grafana-info transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span class="text-sm font-medium text-grafana-text group-hover:text-grafana-strong transition-colors">
                            {{ date }}
                        </span>
                    </div>
                </a>
                {% endfor %}
            </div>
            {% else %}
            <div class="py-16 flex flex-col items-center justify-center text-grafana-muted">
                <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-sm">No historical log folders found.</p>
            </div>
            {% endif %}
        </div>
    </main>
    <script>
        var savedTheme = localStorage.getItem('theme');
        var isDark = savedTheme === 'dark'; 
        if (isDark) document.documentElement.classList.add('dark');
    </script>
</body>
</html>
